base_templates:
  - name: "@RESROOT/META-INF/enumextensions.json"
    _merge_policy: override_all
    template: modbase/enumextensions.json.ftl
    writer: json
    condition_any:
      - "${w.getGElementsOfType('livingentity')?filter(e -> e.mobBehaviourType == \"Raider\")?size != 0}"
      - "${w.hasElementsOfType('specialentity')}"
      - "${w.getGElementsOfType('animatedentity')?filter(e -> e.mobBehaviourType == \"Raider\")?size != 0}"
      - "${w.getGElementsOfType('animateditem')?filter(e -> e.enableArmPose)?size != 0}"
  - name: "@RESROOT/@modid.mixins.json"
    _merge_policy: override_all
    template: modbase/mixin.json.ftl
    writer: json
    condition_any:
      - "${w.getGElementsOfType('biome')?filter(e -> e.spawnBiome || e.spawnInCaves || e.spawnBiomeNether)?size != 0}"
      - "${w.getWorkspace().getModElements()?filter(e -> e.getGeneratableElement().mixins?? && (e.getGeneratableElement().mixins)?has_content)?size != 0}"