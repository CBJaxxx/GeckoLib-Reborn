global_templates:
  - template: aarmor/animation_sync_factory.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/ArmorAnimationFactory.java"

templates:
  - template: aarmor/armor.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/item/@NAMEItem.java"
  - template: aarmor/armor_model.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/item/model/@NAMEModel.java"
  - template: aarmor/armor_renderer.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/client/renderer/@NAMEArmorRenderer.java"

  # NeoForge 26.1 EquipmentClientInfo (Equippable assetId)
  - template: aarmor/armor_equipment.json.ftl
    writer: json
    name: "@MODASSETSROOT/equipment/@registryname.json"

  # Helmet — models/item + items/ client definitions
  - template: ajson/armor/item.json.ftl
    writer: json
    variables: "item=helmet"
    condition:
      - enableHelmet
      - "hasHelmetNormalModel()"
    name: "@MODASSETSROOT/models/item/@registryname_helmet.json"
  - template: ajson/armor/tool.json.ftl
    writer: json
    variables: "item=helmet"
    condition:
      - enableHelmet
      - "hasHelmetToolModel()"
    name: "@MODASSETSROOT/models/item/@registryname_helmet.json"
  - template: ajson/armor/item_cmodel.json.ftl
    writer: json
    variables: "item=helmet"
    condition:
      - enableHelmet
      - "helmetItemRenderType #= 1"
    name: "@MODASSETSROOT/models/item/@registryname_helmet.json"
  - template: ajson/armor/item_cmodel_obj.json.ftl
    writer: json
    condition:
      - enableHelmet
      - "helmetItemRenderType #= 2"
    variables: "item=helmet"
    name: "@MODASSETSROOT/models/item/@registryname_helmet.json"
  - template: ajson/armor/client_item.json.ftl
    writer: json
    variables: "item=helmet"
    condition: enableHelmet
    name: "@MODASSETSROOT/items/@registryname_helmet.json"

  # Body
  - template: ajson/armor/item.json.ftl
    writer: json
    variables: "item=body"
    condition:
      - enableBody
      - "hasBodyNormalModel()"
    name: "@MODASSETSROOT/models/item/@registryname_chestplate.json"
  - template: ajson/armor/tool.json.ftl
    writer: json
    variables: "item=body"
    condition:
      - enableBody
      - "hasBodyToolModel()"
    name: "@MODASSETSROOT/models/item/@registryname_chestplate.json"
  - template: ajson/armor/item_cmodel.json.ftl
    writer: json
    variables: "item=body"
    condition:
      - enableBody
      - "bodyItemRenderType #= 1"
    name: "@MODASSETSROOT/models/item/@registryname_chestplate.json"
  - template: ajson/armor/item_cmodel_obj.json.ftl
    writer: json
    condition:
      - enableBody
      - "bodyItemRenderType #= 2"
    variables: "item=body"
    name: "@MODASSETSROOT/models/item/@registryname_chestplate.json"
  - template: ajson/armor/client_item.json.ftl
    writer: json
    variables: "item=body"
    condition: enableBody
    name: "@MODASSETSROOT/items/@registryname_chestplate.json"

  # Leggings
  - template: ajson/armor/item.json.ftl
    writer: json
    variables: "item=leggings"
    condition:
      - enableLeggings
      - "hasLeggingsNormalModel()"
    name: "@MODASSETSROOT/models/item/@registryname_leggings.json"
  - template: ajson/armor/tool.json.ftl
    writer: json
    variables: "item=leggings"
    condition:
      - enableLeggings
      - "hasLeggingsToolModel()"
    name: "@MODASSETSROOT/models/item/@registryname_leggings.json"
  - template: ajson/armor/item_cmodel.json.ftl
    writer: json
    variables: "item=leggings"
    condition:
      - enableLeggings
      - "leggingsItemRenderType #= 1"
    name: "@MODASSETSROOT/models/item/@registryname_leggings.json"
  - template: ajson/armor/item_cmodel_obj.json.ftl
    writer: json
    condition:
      - enableLeggings
      - "leggingsItemRenderType #= 2"
    variables: "item=leggings"
    name: "@MODASSETSROOT/models/item/@registryname_leggings.json"
  - template: ajson/armor/client_item.json.ftl
    writer: json
    variables: "item=leggings"
    condition: enableLeggings
    name: "@MODASSETSROOT/items/@registryname_leggings.json"

  # Boots
  - template: ajson/armor/item.json.ftl
    writer: json
    variables: "item=boots"
    condition:
      - enableBoots
      - "hasBootsNormalModel()"
    name: "@MODASSETSROOT/models/item/@registryname_boots.json"
  - template: ajson/armor/tool.json.ftl
    writer: json
    variables: "item=boots"
    condition:
      - enableBoots
      - "hasBootsToolModel()"
    name: "@MODASSETSROOT/models/item/@registryname_boots.json"
  - template: ajson/armor/item_cmodel.json.ftl
    writer: json
    variables: "item=boots"
    condition:
      - enableBoots
      - "bootsItemRenderType #= 1"
    name: "@MODASSETSROOT/models/item/@registryname_boots.json"
  - template: ajson/armor/item_cmodel_obj.json.ftl
    writer: json
    condition:
      - enableBoots
      - "bootsItemRenderType #= 2"
    variables: "item=boots"
    name: "@MODASSETSROOT/models/item/@registryname_boots.json"
  - template: ajson/armor/client_item.json.ftl
    writer: json
    variables: "item=boots"
    condition: enableBoots
    name: "@MODASSETSROOT/items/@registryname_boots.json"

tags:
  - tag: ITEMS:minecraft:head_armor
    condition: enableHelmet
    entry: "CUSTOM:@NAME.helmet"
  - tag: ITEMS:minecraft:chest_armor
    condition: enableBody
    entry: "CUSTOM:@NAME.body"
  - tag: ITEMS:minecraft:leg_armor
    condition: enableLeggings
    entry: "CUSTOM:@NAME.legs"
  - tag: ITEMS:minecraft:foot_armor
    condition: enableBoots
    entry: "CUSTOM:@NAME.boots"
  - tag: ITEMS:@modid:@registryname_repair_items
    entryprovider: getRepairItemsAsStringList()

localizationkeys:
  - key: item.@modid.@registryname_helmet
    mapto: helmetName
  - key: item.@modid.@registryname_chestplate
    mapto: bodyName
  - key: item.@modid.@registryname_leggings
    mapto: leggingsName
  - key: item.@modid.@registryname_boots
    mapto: bootsName
