---
neoforge-1.21.1:
  gradle: |
    repositories {
      exclusiveContent {
        forRepository {
          maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
          }
        }
        filter {
          includeGroupAndSubgroups('software.bernie.geckolib')
          includeGroupAndSubgroups('com.geckolib')
        }
      }
    }

    dependencies {
      implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2'
    }
  update_files:
    - ~

neoforge-26.1.2:
  gradle: |
    repositories {
      exclusiveContent {
        forRepository {
          maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
          }
        }
        filter {
          includeGroupAndSubgroups('com.geckolib')
        }
      }
    }

    dependencies {
      implementation 'com.geckolib:geckolib-neoforge-26.1.2:5.5.2'
      interfaceInjectionData 'com.geckolib:geckolib-neoforge-26.1.2:5.5.2'
    }
  update_files:
    - ~

name: "GeckoLib"
