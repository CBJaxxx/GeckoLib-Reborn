---
forge-1.20.1:
  gradle: |
    repositories {
      exclusiveContent {
        forRepository {
          maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
          }
        }
        filter {
          includeGroupAndSubgroups('software.bernie.geckolib')
        }
      }
    }

    dependencies {
      // Spectrall uses NeoForged ModDev LegacyForge: remaps SRG-published Forge mods
      // to official names. Plain implementation leaves GeckoLib on SRG (m_91087_ etc.).
      modImplementation 'software.bernie.geckolib:geckolib-forge-1.20.1:4.8.4'
    }
  update_files:
    - ~

neoforge-1.21.1:
  gradle: |
    repositories {
      exclusiveContent {
        forRepository {
          maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
          }
        }
        filter {
          includeGroupAndSubgroups('software.bernie.geckolib')
          includeGroupAndSubgroups('com.geckolib')
        }
      }
    }

    dependencies {
      implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2'
    }
  update_files:
    - ~

neoforge-26.1.2:
  gradle: |
    repositories {
      exclusiveContent {
        forRepository {
          maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
          }
        }
        filter {
          includeGroupAndSubgroups('com.geckolib')
        }
      }
    }

    dependencies {
      implementation 'com.geckolib:geckolib-neoforge-26.1.2:5.5.2'
      interfaceInjectionData 'com.geckolib:geckolib-neoforge-26.1.2:5.5.2'
    }
  update_files:
    - ~

name: "GeckoLib"
